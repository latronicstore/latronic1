
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1e1e1e;
            color: #fff;
        }

        /* =====================================================
           LOGIN
        ===================================================== */

        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
        }

        #login-box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        #login-box input,
        #login-box button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
        }

        #login-box button {
            background: #e28f2f;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        /* =====================================================
           ADMIN PANEL
        ===================================================== */

        #admin-panel {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        #admin-panel h1 {
            margin-bottom: 15px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        #form-producto input,
        #form-producto textarea,
        #form-producto button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
        }

        #form-producto input,
        #form-producto textarea {
            background: #2a2a2a;
            color: #fff;
        }

        #form-producto button {
            background: #e28f2f;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        #search-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            background: #2a2a2a;
            color: #fff;
            outline: none;
        }

        #search-input:focus {
            box-shadow: 0 0 10px #e28f2f;
        }

        /* =====================================================
           PRODUCTS
        ===================================================== */

        .productos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(220px, 1fr)
            );
            gap: 15px;
        }

        .producto {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            transition: transform 0.2s ease;
            position: relative;
        }

        .producto:hover {
            transform: scale(1.02);
        }

        /* =====================================================
           IMAGE AREA
        ===================================================== */

        .mini-images {
            display: flex;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 70px;
        }

        .image-wrapper {
            width: 65px;
            height: 65px;
            position: relative;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .producto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-error {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5px;
            font-size: 10px;
            color: #ff5555;
            background: #241515;
        }

        .image-number {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* =====================================================
           PRODUCT INPUTS
        ===================================================== */

        .producto input,
        .producto textarea {
            width: 100%;
            margin-bottom: 5px;
            background: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            padding: 7px;
            border: none;
        }

        .producto textarea {
            min-height: 80px;
            resize: vertical;
        }

        .producto button {
            margin-right: 5px;
            margin-top: 5px;
            background: #e28f2f;
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 7px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .producto button:hover {
            background-color: rgb(214, 80, 17);
            color: white;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        #mensaje-guardado {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: #000;
            padding: 10px 15px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 9999;
        }

        /* =====================================================
           TOP BUTTONS
        ===================================================== */

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .top-buttons button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #e28f2f;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .top-buttons button:hover,
        #login-btn:hover,
        #back:hover,
        #form-producto button:hover {
            background-color: rgb(214, 80, 17);
            color: white;
        }

        .advice {
            color: rgba(255, 0, 0, 0.795);
            margin-top: 5px;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        #server-status {
            margin-bottom: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            font-size: 14px;
        }

        .status-ok {
            color: #28a745;
        }

        .status-error {
            color: #ff4444;
        }

        /* =====================================================
           IMAGE DEBUG
        ===================================================== */

        .image-debug {
            margin-top: 8px;
            padding: 6px;
            background: #111;
            border-radius: 4px;
            font-size: 10px;
            color: #999;
            word-break: break-all;
        }

        .image-debug-ok {
            color: #55dd77;
        }

        .image-debug-error {
            color: #ff5555;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            #admin-panel {
                padding: 10px;
                max-width: 100%;
            }

            .productos {
                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(150px, 1fr)
                    );
                gap: 10px;
            }

            .producto {
                padding: 10px;
            }

            .producto img {
                width: 100%;
                height: 100%;
            }

            .producto input,
            .producto textarea,
            .producto button {
                width: 100%;
                margin-bottom: 5px;
            }

            .mini-images {
                flex-direction: row;
            }

            .top-buttons {
                flex-direction: column;
            }

            .top-buttons button {
                width: 100%;
                margin-bottom: 5px;
            }

            #login-box {
                width: 95%;
                max-width: 300px;
                padding: 20px;
            }
        }

        @media (max-width: 400px) {

            .productos {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            #login-box {
                padding: 15px;
            }
        }

    </style>

</head>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ADMIN_PASSWORD = "042525";

/*
   Si admin.html está servido por Node:

       BASE_URL = ""

   Si está en otro servidor:

       BASE_URL = "http://localhost:3000"
*/

const BASE_URL = "";

/*
   MUY IMPORTANTE:

   NO ponemos IMAGE_SERVER_URL en localhost automáticamente.

   El navegador utilizará el mismo servidor que sirve
   admin.html.

   Si tu API está en otro servidor, cambia esto:

       const IMAGE_SERVER_URL =
           "http://localhost:3000";

*/

const IMAGE_SERVER_URL = "";


/* =========================================================
   ELEMENTOS
========================================================= */

const loginScreen =
    document.getElementById("login-screen");

const adminPanel =
    document.getElementById("admin-panel");

const loginBtn =
    document.getElementById("login-btn");

const logoutBtn =
    document.getElementById("logout-btn");

const goShopBtn =
    document.getElementById("go-shop-btn");

const passwordInput =
    document.getElementById("admin-password");

const listaProductos =
    document.getElementById("lista-productos");

const formProducto =
    document.getElementById("form-producto");

const mensajeGuardado =
    document.getElementById("mensaje-guardado");

const searchInput =
    document.getElementById("search-input");

const imagenesFileInput =
    document.getElementById("imagenes-file");

const agregarBtn =
    document.getElementById("agregar-btn");

const statusText =
    document.getElementById("status-text");


/* =========================================================
   VARIABLES
========================================================= */

let productos = [];

let AUTH_TOKEN = "";


/* =========================================================
   SOCKET.IO
========================================================= */

const socket =
    io(BASE_URL || undefined);


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto = "✅ Cambios guardados correctamente"
) {

    mensajeGuardado.textContent = texto;

    mensajeGuardado.style.display = "block";

    setTimeout(() => {

/* =========================================================
   ESTADO SERVIDOR
========================================================= */

function actualizarEstadoServidor(ok, texto) {

    statusText.textContent = texto;

    statusText.className =
        ok
            ? "status-ok"
            : "status-error";
}


/* =========================================================
   DETECTAR CLOUDINARY
========================================================= */

function esCloudinary(url) {

    return /cloudinary\.com/i.test(
        String(url || "")
    );
}


/* =========================================================
   CONVERTIR CLOUDINARY A FORMATO AUTOMÁTICO
========================================================= */

function prepararCloudinary(url) {

    if (!esCloudinary(url)) {
        return url;
    }

    /*
       Si ya contiene f_auto no lo duplicamos.
    */

    if (/\/f_auto[,/]/i.test(url)) {
        return url;
    }

    /*
       Cloudinary:

       /image/upload/

       se convierte en:

       /image/upload/f_auto,q_auto/
    */

    if (url.includes("/image/upload/")) {

        return url.replace(
            "/image/upload/",
            "/image/upload/f_auto,q_auto/"
        );
    }

    return url;
}


/* =========================================================
   NORMALIZAR URL
========================================================= */

function normalizarImagenUrl(url) {

    if (!url) {
        return "";
    }

    let original =
        String(url).trim();

    if (!original) {
        return "";
    }


    /*
       CLOUDINARY
    */

    if (esCloudinary(original)) {

        return prepararCloudinary(
            original
        );
    }


    /*
       DATA
    */

    if (
        /^data:/i.test(original) ||
        /^blob:/i.test(original)
    ) {

        return original;
    }


    /*
       Convertir backslash Windows
    */

    let limpio =
        original.replace(
            /\\/g,
            "/"
        );


    /*
       localhost URL
    */

    try {

        const parsed =
            new URL(limpio);

        if (
            parsed.hostname === "localhost" ||
            parsed.hostname === "127.0.0.1"
        ) {

            limpio =
                parsed.pathname +
                parsed.search;

        }

    }
    catch (e) {
        /* ruta relativa */
    }


    /*
       Quitar ./ 
    */

    limpio =
        limpio.replace(
            /^\.\//,
            ""
        );


    /*
       IMAGE_SERVER_URL
    */

    if (
        limpio.startsWith("/")
    ) {

        if (IMAGE_SERVER_URL) {

            return (
                IMAGE_SERVER_URL.replace(
                    /\/+$/,
                    ""
                ) +
                limpio
            );
        }

        return limpio;
    }


    /*
       Ruta relativa
    */

    if (IMAGE_SERVER_URL) {

        return (
            IMAGE_SERVER_URL.replace(
                /\/+$/,
                ""
            ) +
            "/" +
            limpio.replace(
                /^\/+/,
                ""
            )
        );
    }


    return "/" +
        limpio.replace(
            /^\/+/,
            ""
        );
}


/* =========================================================
   OBTENER NOMBRE Y EXTENSIÓN
========================================================= */

function separarImagen(url) {

    let limpio =
        String(url || "")
            .split("?")[0]
            .split("#")[0];

    const match =
        limpio.match(
            /^(.*?)(?:\.([a-zA-Z0-9]+))?$/
        );

    if (!match) {

        return {
            base: limpio,
            extension: ""
        };
    }

    return {

        base:
            match[1] || limpio,

        extension:
            (
                match[2] || ""
            ).toLowerCase()

    };
}


/* =========================================================
   GENERAR VARIANTES DE IMAGEN
========================================================= */

function obtenerVariantesImagen(url) {

    const original =
        String(url || "").trim();

    if (!original) {
        return [];
    }

    const variantes = [];


    function agregar(valor) {

        if (
            valor &&
            !variantes.includes(valor)
        ) {

            variantes.push(valor);
        }
    }


    /*
       =====================================================
       CLOUDINARY
       =====================================================
    */

    if (esCloudinary(original)) {

        /*
           Original
        */

        agregar(original);

        /*
           f_auto + q_auto
        */

        agregar(
            prepararCloudinary(original)
        );

        return variantes;
    }


    /*
       =====================================================
       URL NORMALIZADA
       =====================================================
    */

    const normalizada =
        normalizarImagenUrl(original);

    agregar(normalizada);


    /*
       =====================================================
       OBTENER RUTA
       =====================================================
    */

    let ruta =
        normalizada;

    try {

        const parsed =
            new URL(normalizada);

        ruta =
            parsed.pathname;

    }
    catch (e) {

        ruta =
            normalizada
                .split("?")[0]
                .split("#")[0];
    }


    ruta =
        ruta.replace(
            /\\/g,
            "/"
        );


    /*
       =====================================================
       BASE + EXTENSIÓN
       =====================================================
    */

    const partes =
        separarImagen(ruta);

    const base =
        partes.base;

    const extension =
        partes.extension;


    /*
       =====================================================
       PRIMERO:
       archivo original
       =====================================================

       EJEMPLO:

       /uploads/1763307089071.jpeg

       SE PRUEBA PRIMERO.
    */


    if (extension) {

        agregar(
            base +
            "." +
            extension
        );
    }


    /*
       =====================================================
       WEBP
       =====================================================
    */

    agregar(
        base + ".webp"
    );


    /*
       =====================================================
       JPEG
       =====================================================
    */

    agregar(
        base + ".jpeg"
    );


    /*
       =====================================================
       JPG
       =====================================================
    */

    agregar(
        base + ".jpg"
    );


    /*
       =====================================================
       PNG
       =====================================================
    */

    agregar(
        base + ".png"
    );


    /*
       =====================================================
       HEIF
       =====================================================
    */

    agregar(
        base + ".heif"
    );


    /*
       =====================================================
       HEIC
       =====================================================
    */

    agregar(
        base + ".heic"
    );


    /*
       =====================================================
       SI SOLO VIENE EL NOMBRE
       =====================================================
    */

    if (
        !ruta.includes("/")
    ) {

        const nombre =
            ruta;

        const baseServidor =
            IMAGE_SERVER_URL
                ? IMAGE_SERVER_URL.replace(
                    /\/+$/,
                    ""
                )
                : "";


        const carpetas = [
            "/images/",
            "/uploads/"
        ];


        const extensiones = [
            "",
            ".webp",
            ".jpeg",
            ".jpg",
            ".png",
            ".heif",
            ".heic"
        ];


        carpetas.forEach(
            carpeta => {

                extensiones.forEach(
                    ext => {

                        agregar(
                            baseServidor +
                            carpeta +
                            nombre +
                            ext
                        );

                    }
                );

            }
        );
    }


    return variantes;
}


/* =========================================================
   DETECTAR HEIF / HEIC
========================================================= */

function esHEIF(url) {

    return /\.(heif|heic)(\?|#|$)/i.test(
        String(url || "")
    );
}


/* =========================================================
   CONVERTIR HEIF / HEIC
========================================================= */

async function convertirHEIF(url) {

    console.log(
        "🟡 HEIF/HEIC detectado:",
        url
    );

    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const blob =
            await response.blob();


        if (
            typeof heic2any !==
            "function"
        ) {

            throw new Error(
                "heic2any no está disponible"
            );
        }


        const convertido =
            await heic2any({

                blob: blob,

                toType:
                    "image/jpeg",

                quality:
                    0.90

            });


        const resultado =
            Array.isArray(convertido)
                ? convertido[0]
                : convertido;


        const objectUrl =
            URL.createObjectURL(
                resultado
            );


        console.log(
            "✅ HEIF/HEIC convertido:",
            objectUrl
        );


        return objectUrl;

    }
    catch (error) {

        console.error(
            "❌ Error convirtiendo HEIF/HEIC:",
            error
        );

        return null;
    }
}


/* =========================================================
   CREAR IMAGEN
========================================================= */

function crearImagenProducto(
    url,
    titulo,
    index
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "image-wrapper";


    const img =
        document.createElement(
            "img"
        );

    img.alt =
        titulo || "Producto";

    img.loading =
        "lazy";

    img.decoding =
        "async";


    const debug =
        document.createElement(
            "div"
        );

    debug.className =
        "image-debug";


    const variantes =
        obtenerVariantesImagen(
            url
        );


    let posicion = 0;

    let convertidoHEIF = false;


    async function intentarSiguiente() {

        /*
           No quedan variantes.
        */

        if (
            posicion >=
            variantes.length
        ) {

            console.error(
                "❌ No se pudo cargar la imagen:",
                url,
                variantes
            );


            wrapper.innerHTML = `
                <div class="image-error">
                    ❌ Imagen<br>
                    no encontrada
                </div>
            `;


            return;
        }


        const siguiente =
            variantes[posicion];

        posicion++;


        console.log(
            `🖼️ Imagen ${index + 1}:`,
            siguiente
        );


        debug.textContent =
            siguiente;


        /*
           =================================================
           HEIF / HEIC
           =================================================
        */

        if (
            esHEIF(siguiente) &&
            !convertidoHEIF
        ) {

            convertidoHEIF = true;


            const resultado =
                await convertirHEIF(
                    siguiente
                );


            if (resultado) {

                img.src =
                    resultado;

                return;
            }
        }


        /*
           Imagen normal
        */

        img.src =
            siguiente;
    }


    img.onload = () => {

        console.log(
            "✅ Imagen cargada:",
            img.src
        );


        debug.textContent =
            "✅ " + img.src;

        debug.className =
            "image-debug image-debug-ok";
    };


    img.onerror = async () => {

        console.warn(
            "⚠️ Falló imagen:",
            img.src
        );


        /*
           Intentar siguiente variante
        */

        await intentarSiguiente();
    };


    wrapper.appendChild(
        img
    );


    const numero =
        document.createElement(
            "span"
        );

    numero.className =
        "image-number";

    numero.textContent =
        index + 1;


    wrapper.appendChild(
        numero
    );


    wrapper.appendChild(
        debug
    );


    wrapper.title =
        String(url);


    intentarSiguiente();


    return wrapper;
}


/* =========================================================
   NORMALIZAR PRODUCTO
========================================================= */

function normalizarProducto(
    p,
    index
) {

    return {

        id:
            p.id ||
            `prod-${Date.now()}-${index}`,

        titulo:
            p.titulo ||
            p.title ||
            "Sin título",

        description:
            p.description ||
            p.descripcion ||
            "",

        imagenes:
            Array.isArray(
                p.imagenes
            )
                ? [
                    ...new Set(
                        p.imagenes
                            .filter(Boolean)
                            .map(
                                x =>
                                    String(x).trim()
                            )
                    )
                ]
                : [],

        categoria: {

            main:
                p.categoria?.main ||
                p.mainCat ||
                "Sin categoría",

            sub:
                p.categoria?.sub ||
                p.subCat ||
                ""

        },

        price:
            Number(
                p.price
            ) || 0,

        stock:
            Number(
                p.stock
            ) || 0

    };
}


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function cargarProductos() {

    console.log(
        "================================="
    );

    console.log(
        "CARGANDO PRODUCTOS"
    );

    console.log(
        "================================="
    );


    try {

        const endpoint =
            BASE_URL +
            "/api/productos";


        console.log(
            "API:",
            endpoint
        );


        const res =
            await fetch(
                endpoint,
                {
                    cache:
                        "no-store",

                    headers: {

                        "Authorization":
                            AUTH_TOKEN

                    }
                }
            );


        console.log(
            "Respuesta API:",
            res.status,
            res.statusText
        );


        if (!res.ok) {

            throw new Error(
                `HTTP ${res.status} - ${res.statusText}`
            );
        }


        const data =
            await res.json();


        console.log(
            "Productos recibidos:",
            data
        );


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "La API no devolvió un array de productos"
            );
        }


        productos =
            data.map(
                normalizarProducto
            );


        console.log(
            "================================="
        );

        console.log(
            "PRODUCTOS PREPARADOS:"
        );

        console.log(
            productos
        );

        console.log(
            "================================="
        );


        /*
           Mostrar todas las imágenes en consola
        */

        productos.forEach(
            (producto, productoIndex) => {

                console.log(
                    `📦 PRODUCTO ${productoIndex + 1}:`,
                    producto.titulo
                );


                producto.imagenes.forEach(
                    (imagen, imagenIndex) => {

                        console.log(
                            `   🖼️ ${imagenIndex + 1}:`,
                            imagen
                        );

                        console.log(
                            "   Variantes:",
                            obtenerVariantesImagen(
                                imagen
                            )
                        );

                    }
                );

            }
        );


        actualizarEstadoServidor(
            true,
            `Connected — ${productos.length} products`
        );


        renderProductos();

    }
    catch (err) {

        console.error(
            "ERROR CARGANDO PRODUCTOS:",
            err
        );


        actualizarEstadoServidor(
            false,
            "Error connecting to server"
        );


        listaProductos.innerHTML = `

            <div style="
                background:#3a1e1e;
                padding:20px;
                border-radius:10px;
                color:#ff5555;
                grid-column:1/-1;
            ">

                <h3>
                    ❌ No se pudieron cargar los productos
                </h3>

                <br>

                <p>
                    ${err.message}
                </p>

                <br>

                <p>
                    Abre F12 → Console para ver más información.
                </p>

            </div>

        `;
    }
}


/* =========================================================
   RENDER PRODUCTOS
========================================================= */

function renderProductos(
    filter = ""
) {

    console.log(
        "Renderizando productos:",
        productos.length
    );


    listaProductos.innerHTML =
        "";


    const textoBusqueda =
        String(filter)
            .toLowerCase()
            .trim();


    const filtrados =
        productos.filter(
            p => {

                const titulo =
                    String(
                        p.titulo || ""
                    )
                    .toLowerCase();

                const descripcion =
                    String(
                        p.description || ""
                    )
                    .toLowerCase();

                return (
                    titulo.includes(
                        textoBusqueda
                    ) ||
                    descripcion.includes(
                        textoBusqueda
                    )
                );
            }
        );


    if (
        filtrados.length === 0
    ) {

        listaProductos.innerHTML = `

            <div style="
                padding:20px;
                background:#2a2a2a;
                border-radius:10px;
                grid-column:1/-1;
            ">

                No products found.

            </div>

        `;

        return;
    }


    filtrados.forEach(
        p => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "producto";


            /* =================================================
               IMÁGENES
            ================================================= */

            const miniImgs =
                document.createElement(
                    "div"
                );

            miniImgs.className =
                "mini-images";


            if (
                Array.isArray(
                    p.imagenes
                ) &&
                p.imagenes.length > 0
            ) {

                /*
                   ELIMINAR DUPLICADOS
                */

                const imagenesUnicas =
                    [
                        ...new Set(
                            p.imagenes
                                .filter(Boolean)
                        )
                    ];


                imagenesUnicas.forEach(
                    (
                        url,
                        index
                    ) => {

                        const image =
                            crearImagenProducto(
                                url,
                                p.titulo,
                                index
                            );


                        miniImgs.appendChild(
                            image
                        );

                    }
                );

            }
            else {

                miniImgs.innerHTML = `

                    <div style="
                        color:#888;
                        padding:10px;
                    ">

                        No images

                    </div>

                `;
            }


            div.appendChild(
                miniImgs
            );


            /* =================================================
               DEBUG
            ================================================= */

            if (
                p.imagenes.length > 0
            ) {

                const debug =
                    document.createElement(
                        "div"
                    );

                debug.className =
                    "image-debug";

                debug.textContent =
                    `${p.imagenes.length} image(s)`;

                div.appendChild(
                    debug
                );
            }


            /* =================================================
               TÍTULO
            ================================================= */

            const tituloInput =
                document.createElement(
                    "input"
                );

            tituloInput.type =
                "text";

            tituloInput.id =
                `titulo-${p.id}`;

            tituloInput.value =
                p.titulo;


            div.appendChild(
                tituloInput
            );


            /* =================================================
               DESCRIPCIÓN
            ================================================= */

            const descTextarea =
                document.createElement(
                    "textarea"
                );

            descTextarea.id =
                `desc-${p.id}`;

            descTextarea.value =
                p.description;


            div.appendChild(
                descTextarea
            );


            /* =================================================
               CATEGORÍA
            ================================================= */

            const mainCatInput =
                document.createElement(
                    "input"
                );

            mainCatInput.type =
                "text";

            mainCatInput.id =
                `mainCat-${p.id}`;

            mainCatInput.value =
                p.categoria?.main || "";

            mainCatInput.placeholder =
                "Categoría principal";


            div.appendChild(
                mainCatInput
            );


            const subCatInput =
                document.createElement(
                    "input"
                );

            subCatInput.type =
                "text";

            subCatInput.id =
                `subCat-${p.id}`;

            subCatInput.value =
                p.categoria?.sub || "";

            subCatInput.placeholder =
                "Subcategoría";


            div.appendChild(
                subCatInput
            );


            /* =================================================
               PRECIO
            ================================================= */

            const priceInput =
                document.createElement(
                    "input"
                );

            priceInput.type =
                "number";

            priceInput.step =
                "0.01";

            priceInput.id =
                `price-${p.id}`;

            priceInput.value =
                p.price;


            div.appendChild(
                priceInput
            );


            /* =================================================
               STOCK
            ================================================= */

            const stockInput =
                document.createElement(
                    "input"
                );

            stockInput.type =
                "number";

            stockInput.id =
                `stock-${p.id}`;

            stockInput.value =
                p.stock;


            div.appendChild(
                stockInput
            );


            /* =================================================
               NUEVAS IMÁGENES
            ================================================= */

            const imgInput =
                document.createElement(
                    "input"
                );

            imgInput.type =
                "file";

            imgInput.id =
                `img-${p.id}`;

            imgInput.multiple =
                true;

            imgInput.accept =
                "image/*,.webp,.heif,.heic";


            div.appendChild(
                imgInput
            );


            /* =================================================
               GUARDAR
            ================================================= */

            const guardarBtn =
                document.createElement(
                    "button"
                );

            guardarBtn.type =
                "button";

            guardarBtn.textContent =
                "Guardar";


            guardarBtn.addEventListener(
                "click",
                async () => {

                    await actualizarProducto(
                        p.id
                    );

                }
            );


            div.appendChild(
                guardarBtn
            );


            /* =================================================
               ELIMINAR
            ================================================= */

            const eliminarBtn =
                document.createElement(
                    "button"
                );

            eliminarBtn.type =
                "button";

            eliminarBtn.textContent =
                "Eliminar";


            eliminarBtn.addEventListener(
                "click",
                async () => {

                    await eliminarProducto(
                        p.id
                    );

                }
            );


            div.appendChild(
                eliminarBtn
            );


            listaProductos.appendChild(
                div
            );

        }
    );
}


/* =========================================================
   ACTUALIZAR PRODUCTO
========================================================= */

async function actualizarProducto(
    id
) {

    const prod =
        productos.find(
            p => p.id === id
        );


    if (!prod) {

        console.error(
            "Producto no encontrado:",
            id
        );

        return;
    }


    /* =====================================================
       NUEVAS IMÁGENES
    ===================================================== */

    let nuevasImagenes = [];


    const fileInput =
        document.getElementById(
            `img-${id}`
        );


    if (
        fileInput &&
        fileInput.files.length > 0
    ) {

        nuevasImagenes =
            await subirImagenes(
                fileInput.files
            );
    }


    /* =====================================================
       DATOS
    ===================================================== */

    const updated = {

        titulo:
            document.getElementById(
                `titulo-${id}`
            ).value,

        description:
            document.getElementById(
                `desc-${id}`
            ).value,

        categoria: {

            main:
                document.getElementById(
                    `mainCat-${id}`
                ).value,

            sub:
                document.getElementById(
                    `subCat-${id}`
                ).value

        },

        price:
            Number(
                document.getElementById(
                    `price-${id}`
                ).value
            ),

        stock:
            Number(
                document.getElementById(
                    `stock-${id}`
                ).value
            ),

        /*
           Mantener imágenes existentes
           y agregar nuevas sin duplicarlas.
        */

        imagenes:
            [
                ...new Set(
                    [
                        ...prod.imagenes,
                        ...nuevasImagenes
                    ]
                )
            ]

    };


    try {

        const res =
            await fetch(
                `${BASE_URL}/api/productos/${id}`,
                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            AUTH_TOKEN

                    },

                    body:
                        JSON.stringify(
                            updated
                        )

                }
            );


        if (!res.ok) {

            throw new Error(
                `HTTP ${res.status}`
            );
        }


        const data =
            await res.json();


        productos =
            productos.map(
                p =>
                    p.id === id
                        ? normalizarProducto(
                            {
                                ...p,
                                ...data,
                                imagenes:
                                    data.imagenes ||
                                    updated.imagenes
                            },
                            0
                        )
                        : p
            );


        socket.emit(
            "productos-actualizados",
            productos
        );


        renderProductos(
            searchInput.value
        );


        mostrarMensaje();


    }
    catch (err) {

        console.error(
            "Error actualizando producto:",
            err
        );


        alert(
            "❌ Error actualizando producto"
        );
    }
}


/* =========================================================
   ELIMINAR PRODUCTO
========================================================= */

async function eliminarProducto(
    id
) {

    if (
        !confirm(
            "¿Seguro que quieres eliminar este producto?"
        )
    ) {

        return;
    }


    try {

        const res =
            await fetch(
                `${BASE_URL}/api/productos/${id}`,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Authorization":
                            AUTH_TOKEN

                    }

                }
            );


        if (!res.ok) {

            throw new Error(
                `HTTP ${res.status}`
            );
        }


        productos =
            productos.filter(
                p =>
                    p.id !== id
            );


        socket.emit(
            "productos-actualizados",
            productos
        );


        renderProductos(
            searchInput.value
        );


        mostrarMensaje();


    }
    catch (err) {

        console.error(
            "Error eliminando producto:",
            err
        );


        alert(
            "❌ Error eliminando producto"
        );
    }
}


/* =========================================================
   SUBIR IMÁGENES
========================================================= */

async function subirImagenes(
    files
) {

    const formData =
        new FormData();


    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        formData.append(
            "imagenes",
            files[i]
        );
    }


    try {

        const res =
            await fetch(
                `${BASE_URL}/api/subir-imagenes`,
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            AUTH_TOKEN

                    },

                    body:
                        formData

                }
            );


        if (!res.ok) {

            console.error(
                "Error subiendo imágenes:",
                res.status,
                res.statusText
            );

            return [];
        }


        const data =
            await res.json();


        console.log(
            "Respuesta subida:",
            data
        );


        return Array.isArray(
            data.urls
        )

            ? [
                ...new Set(
                    data.urls
                )
            ]

            : [];

    }
    catch (err) {

        console.error(
            "Error subiendo imágenes:",
            err
        );

        return [];
    }
}
